name: Bug report
description: A crash, an error message or something that does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use fake data only, and remove tokens and credentials from any output.
        Security problems go through SECURITY.md (private reporting), not public issues.
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Command and output
      description: The exact command and the error (redact anything secret).
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "psirt-exposure commit, OS, Python version, uv version"
    validations:
      required: true
  - type: checkboxes
    id: fake
    attributes:
      label: Data check
      options:
        - label: No real device data, tokens or credentials are included.
          required: true
