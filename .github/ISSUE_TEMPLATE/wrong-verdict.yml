name: Wrong verdict
description: A device got the wrong verdict for an advisory.
labels: ["wrong-verdict"]
body:
  - type: markdown
    attributes:
      value: |
        **Use fake data only.** Never paste a real configuration, hostname, IP address, SNMP
        community, password hash, key or serial number. Write a minimal config that reproduces the
        problem, with documentation IPs (192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24).
  - type: input
    id: advisory
    attributes:
      label: Advisory ID and rule key
      placeholder: cisco-sa-iosxe-webui-privesc-j22SaA4z (webui)
    validations:
      required: true
  - type: input
    id: verdicts
    attributes:
      label: Expected and actual verdict
      placeholder: "expected NOT_AFFECTED_FEATURE_DISABLED, got AFFECTED"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal fake config (and show version, if relevant)
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the expected verdict is right
      description: Quote the advisory sentence that decides it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: psirt-exposure version or commit
  - type: checkboxes
    id: fake
    attributes:
      label: Data check
      options:
        - label: Everything above is fake or public advisory text; no real device data.
          required: true
