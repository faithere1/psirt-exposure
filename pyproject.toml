[project]
name = "netsec-check"
version = "0.0.1"
description = "Am I actually affected? Match Cisco PSIRT advisories against device configs with evidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "ciscoconfparse2>=0.9.18",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
netsec-check = "netsec_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# ciscoconfparse2 0.9.18 pins dnspython==2.8.0 (CVE-2026-114605, fixed in 2.9.0). netsec-check never
# calls its DNS helpers; drop this override once ciscoconfparse2 relaxes the pin.
override-dependencies = ["dnspython>=2.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsec_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: talks to the real openVuln API / CISA KEV feed (opt-in, NETSEC_LIVE=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
